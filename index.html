async function init(){const {data:{user:u}}=await sb.auth.getUser();if(!u){show('login');return}const {data:m,error}=await sb.from('sqa_members').select('role,active').eq('user_id',u.id).maybeSingle();if(error||!m?.active){show('login');E('loginmsg').textContent='Account non autorizzato';return}user=u;member=m;show('app');const [a,b,c]=await Promise.all([sb.from('sqa_site_access').select('site_id').eq('user_id',u.id),sb.from('sqa_sites').select('id,name').eq('active',true).order('name'),sb.from('sqa_documents').select('id,code,title,destination,status_hint,storage_path,restricted').order('id')]);if(a.error||b.error||c.error){E('status').classList.remove('hidden');E('status').textContent='Errore caricamento: '+(a.error||b.error||c.error).message;return}const ids=new Set((a.data||[]).map(x=>x.site_id));E('site').replaceChildren();const preferredSites=['lecce_penale','taranto_trib','brindisi_trib_proc'];const orderedSites=[...(b.data||[])].sort((x,y)=>{const a=preferredSites.indexOf(x.id),b=preferredSites.indexOf(y.id);return (a<0?999:a)-(b<0?999:b)||x.name.localeCompare(y.name,'it')});for(const s of orderedSites){if(!ids.has(s.id))continue;const o=document.createElement('option');o.value=s.id;o.textContent=s.name;E('site').append(o)}docs=c.data||[];site=E('site').value;if(!site){E('status').classList.remove('hidden');E('status').textContent='Nessuna sede assegnata';return}await load()}

function code(d){const n=parseInt(d.id.slice(1),10);if(d.id.startsWith('m'))return 'REC-'+String(n-72).padStart(2,'0');const dest=d.destination.toLowerCase();let prefix=dest.includes('bacheca ufficio')?'UFF':dest.includes('bacheca magazzino')?'MAG':dest.includes('faldone')?'FAL':'DOC';const idx=docs.filter(x=>x.id.startsWith('f')&&x.destination.toLowerCase().includes(prefix==='UFF'?'bacheca ufficio':prefix==='MAG'?'bacheca magazzino':prefix==='FAL'?'faldone':'_none_')).findIndex(x=>x.id===d.id);return prefix+'-'+String(idx>=0?idx+1:n).padStart(2,'0')}
function matches(d){const dest=d.destination.toLowerCase();if(kind==='office')return dest.includes('bacheca ufficio');if(kind==='warehouse')return dest.includes('bacheca magazzino')||dest.includes('magazzino · sds')||dest.includes('primo soccorso');if(kind==='binders')return !d.id.startsWith('m')&&!dest.includes('bacheca ufficio')&&!dest.includes('bacheca magazzino')&&!dest.includes('magazzino · sds');if(kind==='missing')return d.id.startsWith('m')||d.status_hint==='Da acquisire';return false}

function explainDocument(d){
 const t=d.title.toLowerCase(),dest=d.destination.toLowerCase(),isMissing=d.id.startsWith('m')||d.status_hint==='Da acquisire';

 if(t.includes('locandina')){meaning='Materiale informativo che richiama ai lavoratori comportamenti e precauzioni da osservare sul tema trattato.';importance='Mantiene alta l’attenzione sul rischio o sul comportamento trattato; non sostituisce formazione, istruzioni operative o valutazione dei rischi.';location='Bacheca informativa della sede, durante il periodo di esposizione previsto; verificare se la locandina debba essere sostituita a rotazione.'}

 else if(t.includes('nomine')||t.includes('incaricati gestione emergenze')||t.includes('preposti')){meaning='Elenco o atto che individua le persone incaricate dei ruoli di sicurezza o della gestione delle emergenze.';importance='Consente di sapere a chi rivolgersi e di verificare la copertura degli incarichi previsti.';location='Faldone B; gli elenchi operativi da esporre devono essere aggiornati e pertinenti alla sede.'}

 else if(t.includes('contratto')||t.includes('consegna locali')){meaning='Documentazione contrattuale o verbale di consegna che definisce il rapporto di appalto e le condizioni di presa in carico.';importance='Permette di ricostruire responsabilità, dotazioni e condizioni concordate.';location='Archivio contrattuale autorizzato, con copia di riferimento nel faldone pertinente quando previsto.'}
 if(isMissing)caution+=' Il documento risulta da acquisire: la descrizione non ne certifica la disponibilità o il contenuto.';
 return {meaning,location,importance,caution};
}

function render(){const root=E('doclist');root.replaceChildren();if(['organize','periodic'].includes(kind))return;const q=E('search').value.toLowerCase(),only=E('onlymissing').checked;const list=docs.filter(d=>matches(d)&&(!q||(code(d)+' '+d.title+' '+d.destination).toLowerCase().includes(q))&&(!only||!checks[d.id]?.verified));E('sectiontitle').textContent=sections[kind]+' ('+list.length+')';if(!list.length){root.append(el('p','Nessun documento trovato.'));return}for(const d of list){const c=checks[d.id]||{},card=el('article',undefined,'doc'),h=el('h3');h.append(el('span',code(d),'code'),document.createTextNode(d.title));card.append(h);const statusWrap=el('div',undefined,'file-status-wrap');statusWrap.append(el('span',d.destination,'tag destination-tag'));const missingFile=d.id.startsWith('m')||d.status_hint==='Da acquisire';const present=!!d.storage_path;const statusName=missingFile?'Da richiedere':present?'File presente':'Da caricare';statusWrap.append(el('span',statusName,'tag file-state '+(missingFile?'file-missing':present?'file-present':'file-pending')));const info=el('button','i','info-trigger');info.type='button';info.setAttribute('aria-label','Informazioni sul documento '+d.title);info.setAttribute('aria-expanded','false');const pop=el('div',undefined,'info-popover hidden');pop.setAttribute('role','note');const detail=explainDocument(d);for(const [heading,value] of [['Che cos’è e a cosa serve',detail.meaning],['Dove collocarlo o conservarlo',detail.location],['Perché è importante',detail.importance]]){const section=el('div',undefined,'info-section');section.append(el('strong',heading),el('p',value));pop.append(section)}if(detail.caution)pop.append(el('p',detail.caution,'info-caution'));info.onclick=()=>{const wasHidden=pop.classList.contains('hidden');document.querySelectorAll('.info-popover:not(.hidden)').forEach(x=>{x.classList.add('hidden');const b=x.parentElement?.querySelector('.info-trigger');if(b)b.setAttribute('aria-expanded','false')});pop.classList.toggle('hidden',!wasHidden);info.setAttribute('aria-expanded',String(wasHidden))};statusWrap.append(info,pop);card.append(statusWrap);const purpose=d.status_hint==='Da acquisire'?'Documento da richiedere o verificare':'Verificare applicabilità e versione in uso';const p=el('p');p.append(el('b','A cosa serve / indicazioni: '),document.createTextNode(purpose));card.append(p);const action=el('p',d.status_hint==='Da acquisire'?'Azione: recuperare e validare il documento prima dell’uso':'Azione: verificare, stampare e collocare secondo pertinenza · Verificare revisione','muted');card.append(action);const checksRow=el('div',undefined,'checks');for(const [key,label] of [['verified','Verificato'],['printed','Stampato'],['posted','Affisso'],['archived','Archiviato']]){if(key==='archived'&&!d.destination.toLowerCase().includes('faldone'))continue;const l=el('label'),cb=el('input');cb.type='checkbox';cb.checked=!!c[key];cb.disabled=!canWrite();cb.onchange=()=>saveCheck(d.id,{[key]:cb.checked});l.append(cb,document.createTextNode(label));checksRow.append(l)}card.append(checksRow);const fields=el('div',undefined,'fields');const dateRow=el('div',undefined,'date-row');const dateLabel=el('label','Data verifica');const date=el('input');date.type='date';date.value=c.checked_at||'';date.disabled=!canWrite();date.setAttribute('aria-label','Data verifica');dateRow.append(dateLabel,date);const noteLabel=el('label','Note e osservazioni','note-label');const note=el('textarea');note.rows=2;note.placeholder='Posizione del documento, referente, problemi riscontrati…';note.value=c.notes||'';note.disabled=!canWrite();note.setAttribute('aria-label','Note e osservazioni');const save=el('button','Salva data e note','primary save-button');save.disabled=!canWrite();save.onclick=async()=>{save.disabled=true;save.textContent='Salvataggio…';await saveCheck(d.id,{checked_at:date.value||null,notes:note.value})};fields.append(dateRow,noteLabel,note,save);card.append(fields);const actions=el('div',undefi let viewerBlobUrl=null,viewerSignedUrl=null;
function closeViewer(){const modal=E('document-viewer');if(modal)modal.remove();if(viewerBlobUrl){URL.revokeObjectURL(viewerBlobUrl);viewerBlobUrl=null}viewerSignedUrl=null;document.body.style.overflow=''}
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(window.sqaPdfLoader)return window.sqaPdfLoader;window.sqaPdfLoader=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';script.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(pdfjsLib)};script.onerror=()=>reject(new Error('Visualizzatore PDF non disponibile'));document.head.append(script)});return window.sqaPdfLoader}

 const toolbar=el('div',undefined,'viewer-toolbar');const print=el('button','Stampa documento');const download=el('button','Scarica');const external=el('button','Apri in altra scheda');for(const b of [print,download,external]){b.disabled=true;toolbar.append(b)}

  const response=await fetch(data.signedUrl);if(!response.ok)throw new Error('Download non riuscito ('+response.status+')');const blob=await response.blob();if(!overlay.isConnected)return;viewerBlobUrl=URL.createObjectURL(blob);
  print.disabled=false;download.disabled=false;external.disabled=false;
  download.onclick=()=>{const a=document.createElement('a');a.href=viewerBlobUrl;a.download=d.original_filename||d.title+(blob.type.includes('pdf')?'.pdf':'');a.click()};

  body.replaceChildren();

  else if(blob.type.startsWith('image/')||/\.(jpg|jpeg|png|webp|gif)$/i.test(d.storage_path)){const img=el('img');img.src=viewerBlobUrl;img.alt=d.title;img.className='viewer-image';body.append(img)}
  else{body.append(el('p','Anteprima non disponibile per questo formato. Usa Scarica o Apri in altra scheda.','viewer-message'))}
 }catch(e){if(!overlay.isConnected)return;body.replaceChildren(el('p','Impossibile visualizzare l’anteprima: '+(e.message||e),'viewer-message'));if(viewerSignedUrl){external.disabled=false;external.onclick=()=>window.open(viewerSignedUrl,'_blank','noopener')}}
}
async function saveCheck(id,patch){const c=checks[id]||{};const row={site_id:site,document_id:id,verified:!!c.verified,printed:!!c.printed,posted:!!c.posted,archived:!!c.archived,notes:c.notes||'',checked_at:c.checked_at||null,...patch,updated_by:user.id,updated_at:new Date().toISOString()};const {error}=await sb.from('sqa_checks').upsert(row,{onConflict:'site_id,document_id'});if(error)toast('Errore: '+error.message);else{checks[id]=row;toast('Salvato online');await load()}}
function renderTasks(){const root=E('tasklist');root.replaceChildren();const list=jobTasks.filter(x=>kind==='organize'?x[0].startsWith('warehouse-'):!x[0].startsWith('warehouse-'));for(const [key,title,desc] of list){const t=tasks[key]||{},div=el('div',undefined,'task'),h=el('h3',title),p=el('p',desc,'muted'),label=el('label'),cb=el('input');cb.type='checkbox';cb.checked=!!t.done;cb.disabled=!canWrite();label.append(cb,' Completato');const note=el('textarea');note.placeholder='Note';note.value=t.notes||'';note.disabled=!canWrite();const b=el('button','Salva');b.disabled=!canWrite();b.onclick=()=>saveTask(key,cb.checked,note.value);cb.onchange=()=>saveTask(key,cb.checked,note.value);div.append(h,p,label,note,b);root.append(div)}}
async function saveTask(key,done,notes){const {error}=await sb.from('sqa_tasks').upsert({site_id:site,task_key:key,done,notes,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'site_id,task_key'});if(error)toast('Errore: '+error.message);else{toast('Attività salvata');await load()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));const k=b.dataset.tab;if(k==='home')window.scrollTo({top:0,behavior:'smooth'});else if(k==='documents'){document.querySelector('[data-kind="office"]').click();E('sectiontitle').scrollIntoView({behavior:'smooth'})}else if(k==='search'){document.querySelector('[data-kind="office"]').click();E('search').scrollIntoView({behavior:'smooth'});E('search').focus()}else if(k==='report')E('export').scrollIntoView({behavior:'smooth'});else if(k==='sites'){E('site').scrollIntoView({behavior:'smooth'});E('site').focus()}});
E('export').onclick=()=>{const rows=[['Codice','Documento','Destinazione','Verificato','Stampato','Affisso','Archiviato','Data','Note'],...docs.map(d=>{const c=checks[d.id]||{};return[code(d),d.title,d.destination,c.verified?'Si':'No',c.printed?'Si':'No',c.posted?'Si':'No',c.archived?'Si':'No',c.checked_at||'',c.notes||'']})];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=el('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SQA_N153_'+site+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
(async()=>{const params=new URLSearchParams(location.hash.slice(1));if(params.get('type')==='recovery'&&params.get('access_token')&&params.get('refresh_token')){const {error}=await sb.auth.setSession({access_token:params.get('access_token'),refresh_token:params.get('refresh_token')});if(!error)show('recovery')}else init()})();
</script></body></html>
