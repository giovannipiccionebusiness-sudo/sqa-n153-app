const sb=window.supabase.createClient('https://dpbiyrhkpgvqwbneorll.supabase.co','sb_publishable_fVUfDlH5HbEvxUwno9fNNQ_7FbbY-5M'),E=id=>document.getElementById(id);
let member=null,user=null,site='',docs=[],checks={},tasks={},kind='office';const sections={office:'Bacheca ufficio',warehouse:'Bacheca magazzino',binders:'Faldoni',organize:'Organizza magazzino',missing:'Da recuperare',periodic:'Controlli periodici'};
const jobTasks=[['warehouse-chem','Prodotti chimici','Verificare etichette, compatibilità, SDS e stoccaggio sicuro'],['warehouse-tools','Attrezzature','Controllare scaffali, macchine, integrità e segregazione dei guasti'],['warehouse-carts','Carrelli','Verificare ordine, pulizia e collocazione dei carrelli'],['warehouse-ppe','DPI','Verificare disponibilità, conservazione e consegne'],['warehouse-exits','Vie di esodo','Verificare passaggi, uscite e presidi antincendio liberi'],['warehouse-firstaid','Primo soccorso','Verificare cassetta, scadenze e registro controlli'],['general-pei','PEI e planimetrie','Verificare piano emergenze e planimetrie della sede'],['general-duvri','DUVRI','Verificare DUVRI aggiornato con la committente'],['general-sds','Schede di sicurezza','Verificare SDS effettive dei prodotti utilizzati'],['general-pfto','PFTO','Verificare collocazione del PFTO già stampato'],['general-signatures','Consegne firmate','Verificare DPI e tesserini consegnati con firma'],['general-training','Formazione','Verificare attestati e nomine pertinenti alla sede']];
const toast=t=>{E('toast').textContent=t;E('toast').style.display='block';setTimeout(()=>E('toast').style.display='none',3500)};
function show(id){for(const x of ['login','recovery','app'])E(x).classList.toggle('hidden',x!==id)}
function canWrite(){return member&&['admin','supervisor'].includes(member.role)}
E('signin').onclick=async()=>{E('loginmsg').textContent='Accesso…';const {error}=await sb.auth.signInWithPassword({email:E('email').value.trim(),password:E('password').value});if(error)E('loginmsg').textContent=error.message;else init()};
E('forgot').onclick=async()=>{const email=E('email').value.trim();if(!email){E('loginmsg').textContent='Inserisci la tua email';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});E('loginmsg').textContent=error?error.message:'Se l’account è registrato riceverai un link via email.'};
E('setpass').onclick=async()=>{if(E('newpass').value.length<12){E('recoverymsg').textContent='Minimo 12 caratteri';return}const {error}=await sb.auth.updateUser({password:E('newpass').value});E('recoverymsg').textContent=error?error.message:'Password aggiornata';if(!error){history.replaceState(null,'',location.pathname);init()}};
E('logout').onclick=async()=>{await sb.auth.signOut();show('login')};sb.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY')show('recovery')});
E('site').onchange=async()=>{site=E('site').value;await load()};
E('search').oninput=render;E('onlymissing').onchange=render;
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));E('sectiontitle').textContent=sections[kind];E('docsection').classList.toggle('hidden',['organize','periodic'].includes(kind));E('tasksection').classList.toggle('hidden',!['organize','periodic'].includes(kind));render();renderTasks()});
async function init(){const {data:{user:u}}=await sb.auth.getUser();if(!u){show('login');return}const {data:m,error}=await sb.from('sqa_members').select('role,active').eq('user_id',u.id).maybeSingle();if(error||!m?.active){show('login');E('loginmsg').textContent='Account non autorizzato';return}user=u;member=m;show('app');E('identity').textContent=u.email+' · '+m.role;const [a,b,c]=await Promise.all([sb.from('sqa_site_access').select('site_id').eq('user_id',u.id),sb.from('sqa_sites').select('id,name').eq('active',true).order('name'),sb.from('sqa_documents').select('id,code,title,destination,status_hint,storage_path,restricted').order('id')]);if(a.error||b.error||c.error){E('status').textContent='Errore caricamento: '+(a.error||b.error||c.error).message;return}const ids=new Set((a.data||[]).map(x=>x.site_id));E('site').replaceChildren();for(const s of b.data||[]){if(!ids.has(s.id))continue;const o=document.createElement('option');o.value=s.id;o.textContent=s.name;E('site').append(o)}docs=c.data||[];site=E('site').value;if(!site){E('status').textContent='Nessuna sede assegnata';return}await load()}
async function load(){E('status').textContent='Sincronizzazione…';const [a,b]=await Promise.all([sb.from('sqa_checks').select('*').eq('site_id',site),sb.from('sqa_tasks').select('*').eq('site_id',site)]);if(a.error||b.error){E('status').textContent='Errore: '+(a.error||b.error).message;return}checks=Object.fromEntries((a.data||[]).map(x=>[x.document_id,x]));tasks=Object.fromEntries((b.data||[]).map(x=>[x.task_key,x]));E('total').textContent=docs.length;E('verified').textContent=Object.values(checks).filter(x=>x.verified).length;E('missing').textContent=docs.filter(d=>d.status_hint==='Da acquisire'&&!checks[d.id]?.verified).length;E('status').textContent='Controlli sincronizzati · '+new Date().toLocaleString('it-IT');render();renderTasks()}
function code(d){const n=parseInt(d.id.slice(1),10);if(d.id.startsWith('m'))return 'REC-'+String(n-72).padStart(2,'0');const dest=d.destination.toLowerCase();let prefix=dest.includes('bacheca ufficio')?'UFF':dest.includes('bacheca magazzino')?'MAG':dest.includes('faldone')?'FAL':'DOC';const idx=docs.filter(x=>x.id.startsWith('f')&&x.destination.toLowerCase().includes(prefix==='UFF'?'bacheca ufficio':prefix==='MAG'?'bacheca magazzino':prefix==='FAL'?'faldone':'_none_')).findIndex(x=>x.id===d.id);return prefix+'-'+String(idx>=0?idx+1:n).padStart(2,'0')}
function matches(d){const dest=d.destination.toLowerCase();if(kind==='office')return dest.includes('bacheca ufficio');if(kind==='warehouse')return dest.includes('bacheca magazzino')||dest.includes('magazzino · sds')||dest.includes('primo soccorso');if(kind==='binders')return !d.id.startsWith('m')&&!dest.includes('bacheca ufficio')&&!dest.includes('bacheca magazzino')&&!dest.includes('magazzino · sds');if(kind==='missing')return d.id.startsWith('m')||d.status_hint==='Da acquisire';return false}
function el(tag,txt,cls){const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x}
function render(){const root=E('doclist');root.replaceChildren();if(['organize','periodic'].includes(kind))return;const q=E('search').value.toLowerCase(),only=E('onlymissing').checked;const list=docs.filter(d=>matches(d)&&(!q||(code(d)+' '+d.title+' '+d.destination).toLowerCase().includes(q))&&(!only||!checks[d.id]?.verified));E('sectiontitle').textContent=sections[kind]+' ('+list.length+')';if(!list.length){root.append(el('p','Nessun documento trovato.'));return}for(const d of list){const c=checks[d.id]||{},card=el('article',undefined,'doc'),h=el('h3');h.append(el('span',code(d),'code'),document.createTextNode(d.title));card.append(h,el('span',d.destination,'tag'),el('span',d.status_hint==='Da acquisire'?'Da recuperare':'Da verificare','tag'));const purpose=d.title.toLowerCase().includes('locandina')?'Locandina a rotazione':d.status_hint==='Da acquisire'?'Documento da richiedere o verificare':'Verificare applicabilità e versione in uso';const p=el('p');p.append(el('b','A cosa serve / indicazioni: '),document.createTextNode(purpose));card.append(p);const action=el('p',d.status_hint==='Da acquisire'?'Azione: recuperare e validare il documento prima dell’uso':'Azione: verificare, stampare e collocare secondo pertinenza · Verificare revisione','muted');card.append(action);const checksRow=el('div',undefined,'checks');for(const [key,label] of [['verified','Verificato'],['printed','Stampato'],['posted','Affisso'],['archived','Archiviato']]){if(key==='archived'&&!d.destination.toLowerCase().includes('faldone'))continue;const l=el('label'),cb=el('input');cb.type='checkbox';cb.checked=!!c[key];cb.disabled=!canWrite();cb.onchange=()=>saveCheck(d.id,{[key]:cb.checked});l.append(cb,document.createTextNode(label));checksRow.append(l)}card.append(checksRow);const fields=el('div',undefined,'fields');const dateRow=el('div',undefined,'date-row');const dateLabel=el('label','Data verifica');const date=el('input');date.type='date';date.value=c.checked_at||'';date.disabled=!canWrite();date.setAttribute('aria-label','Data verifica');dateRow.append(dateLabel,date);const noteLabel=el('label','Note e osservazioni','note-label');const note=el('textarea');note.rows=2;note.placeholder='Posizione del documento, referente, problemi riscontrati…';note.value=c.notes||'';note.disabled=!canWrite();note.setAttribute('aria-label','Note e osservazioni');const save=el('button','Salva data e note','primary save-button');save.disabled=!canWrite();save.onclick=async()=>{save.disabled=true;save.textContent='Salvataggio…';await saveCheck(d.id,{checked_at:date.value||null,notes:note.value})};fields.append(dateRow,noteLabel,note,save);card.append(fields);const actions=el('div',undefined,'actions');if(d.storage_path){for(const label of ['Apri originale','Apri per stampare']){const b=el('button',label);b.onclick=()=>openDoc(d);actions.append(b)}}else actions.append(el('span','Originale non ancora disponibile online','muted'));card.append(actions);root.append(card)}}
async function openDoc(d){const {data,error}=await sb.storage.from('sqa-n153-private').createSignedUrl(d.storage_path,60);if(error)toast('Documento non accessibile: '+error.message);else window.open(data.signedUrl,'_blank','noopener')}
async function saveCheck(id,patch){const c=checks[id]||{};const row={site_id:site,document_id:id,verified:!!c.verified,printed:!!c.printed,posted:!!c.posted,archived:!!c.archived,notes:c.notes||'',checked_at:c.checked_at||null,...patch,updated_by:user.id,updated_at:new Date().toISOString()};const {error}=await sb.from('sqa_checks').upsert(row,{onConflict:'site_id,document_id'});if(error)toast('Errore: '+error.message);else{checks[id]=row;toast('Salvato online');await load()}}
function renderTasks(){const root=E('tasklist');root.replaceChildren();const list=jobTasks.filter(x=>kind==='organize'?x[0].startsWith('warehouse-'):!x[0].startsWith('warehouse-'));for(const [key,title,desc] of list){const t=tasks[key]||{},div=el('div',undefined,'task'),h=el('h3',title),p=el('p',desc,'muted'),label=el('label'),cb=el('input');cb.type='checkbox';cb.checked=!!t.done;cb.disabled=!canWrite();label.append(cb,' Completato');const note=el('textarea');note.placeholder='Note';note.value=t.notes||'';note.disabled=!canWrite();const b=el('button','Salva');b.disabled=!canWrite();b.onclick=()=>saveTask(key,cb.checked,note.value);cb.onchange=()=>saveTask(key,cb.checked,note.value);div.append(h,p,label,note,b);root.append(div)}}
async function saveTask(key,done,notes){const {error}=await sb.from('sqa_tasks').upsert({site_id:site,task_key:key,done,notes,updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'site_id,task_key'});if(error)toast('Errore: '+error.message);else{toast('Attività salvata');await load()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===b));const k=b.dataset.tab;if(k==='home')window.scrollTo({top:0,behavior:'smooth'});else if(k==='documents'){document.querySelector('[data-kind="office"]').click();E('sectiontitle').scrollIntoView({behavior:'smooth'})}else if(k==='search'){document.querySelector('[data-kind="office"]').click();E('search').scrollIntoView({behavior:'smooth'});E('search').focus()}else if(k==='report')E('export').scrollIntoView({behavior:'smooth'});else if(k==='sites'){E('site').scrollIntoView({behavior:'smooth'});E('site').focus()}});
E('export').onclick=()=>{const rows=[['Codice','Documento','Destinazione','Verificato','Stampato','Affisso','Archiviato','Data','Note'],...docs.map(d=>{const c=checks[d.id]||{};return[code(d),d.title,d.destination,c.verified?'Si':'No',c.printed?'Si':'No',c.posted?'Si':'No',c.archived?'Si':'No',c.checked_at||'',c.notes||'']})];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=el('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='SQA_N153_'+site+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
(async()=>{const params=new URLSearchParams(location.hash.slice(1));if(params.get('type')==='recovery'&&params.get('access_token')&&params.get('refresh_token')){const {error}=await sb.auth.setSession({access_token:params.get('access_token'),refresh_token:params.get('refresh_token')});if(!error)show('recovery')}else init()})();
</script></body></html>
